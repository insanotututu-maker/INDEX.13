<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body class="bg-black text-light d-flex align-items-center justify-content-center mi-vh-100 p-3">
    <div class="card bg-dark text-light border-secondary shadow-lg col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card-header border-secondary text-center py-3">
            <span class="badge bg-info text-dark text-uppercase fw-bold mb-1">
                BTH Sistemas Informaticos 5to Sec.
            </span>
            <h2 id="nombreEstudiante" class="h4 fw-bold text-white mb-0">Juan Manul Perez Mamani</h2>
        </div>
        <div class="card-body p-4">
            <div class="alert bg-black border border-secondary text-light text-center mb-4">
                <p id="notaPromedio" class="fs-4 fw-bold mb-0 text-light">Promedio Anual: 0.0 Pts</p>
            </div>
            <div class="mb-3">
                <label for="NotaTrimestre1" class="form-label fw-semibold text-secondary">Nota 1er Trimestre (0 - 100)</label>
                <input type="number" id="notaTrimestre1" placeholder="Ej. 67" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <div class="mb-3">
                <label for="NotaTrimestre2" class="form-label fw-semibold text-secondary">Nota 2do Trimestre (0 - 100)</label>
                <input type="number" id="notaTrimestre2" placeholder="Ej. 67" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <div class="mb-3">
                <label for="NotaTrimestre3" class="form-label fw-semibold text-secondary">Nota 3er Trimestre (0 - 100)</label>
                <input type="number" id="notaTrimestre3" placeholder="Ej. 67" min="10" max="100" class="form-control bg-black text-light border-secondary">
            </div>
            <button id="btnCalcular" type="button" class="btn btn-success w-100 fw-bold py-2 text-uppercase">Calcular Nota Final</button>
        </div>
        <div class="card-footer border-secondary text-center text-secondary small">
            Nota minima de aprobación: 51.0 Pts
        </div>
    </div>
    <script src="script.js"></script>
    
</body>
</html>
